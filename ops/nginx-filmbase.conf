server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name filmbase.fun www.filmbase.fun;
    ssl_certificate /etc/letsencrypt/live/filmbase.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/filmbase.fun/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($host !~ ^(filmbase\.fun|www\.filmbase\.fun)$) {
        return 444;
    }

    # Large downloads must bypass Next.js. Proxying multi-gigabyte response
    # bodies through Node caused the catalogue process to hit its memory limit.
    location = /media/Spider-Man-Brand-New-Day-2026-1080p-(FilmBase.fun).mp4 {
        proxy_pass http://161.97.114.154:8006/Spider-Man-Brand-New-Day-2026-1080p-(FilmBase.fun).mp4;
        proxy_http_version 1.1;
        proxy_set_header Host media.filmbase.fun;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 1h;
        proxy_read_timeout 1h;
        add_header Content-Disposition 'attachment; filename="Spider-Man-Brand-New-Day-2026-1080p-(FilmBase.fun).mp4"' always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /stream-media/Spider-Man-Brand-New-Day-2026-1080p-(FilmBase.fun).mp4 {
        proxy_pass http://161.97.114.154:8006/Spider-Man-Brand-New-Day-2026-1080p-(FilmBase.fun).mp4;
        proxy_http_version 1.1;
        proxy_set_header Host media.filmbase.fun;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 1h;
        proxy_read_timeout 1h;
        add_header Content-Disposition inline always;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://127.0.0.1:3310;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 3s;
        proxy_send_timeout 20s;
        proxy_read_timeout 20s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name filmbase.fun www.filmbase.fun;
    return 301 https://$host$request_uri;
}
